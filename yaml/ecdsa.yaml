id: ECDSA
oid: 1.2.840.10045.4
name: Elliptic Curve Digital Signature Algorithm
cryptoClass: Asymmetric-Key-Algorithm/Digital-Signature
commonkeySize: ['256', '384']
specifiedkeySize: {min: '224', max: '521'}
reference:
  - https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
grammarExpressionReference:
 - [1, curve]
 - [2, keyLength]
 - [3, hashFunction]
 - [4, nonceGeneration]
parameters:
  curve: ['P-224', 'P-256', 'P-384', 'P-521', 'B-233', 'B-283', 'B-409', 'B-571', 'K-233', 'K-283', 'K-409', 'K-571']
  hashFunction: ['SHA-224', 'SHA-256', 'SHA-384', 'SHA-512', 'SHA-512/224', 'SHA-512/256', 'SHA3-224', 'SHA3-256', 'SHA3-384', 'SHA3-512']
  nonceGeneration: ['Random', 'Deterministic']
  keyLength: ['224', '256', '384', '521']
